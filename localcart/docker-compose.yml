version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localcart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: localcart
      POSTGRES_PASSWORD: localcart_secret
      POSTGRES_DB: localcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
