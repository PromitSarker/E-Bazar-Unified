services:
  db:
    image: postgres:16-alpine
    container_name: localcart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: localcart
      POSTGRES_PASSWORD: localcart_secret
      POSTGRES_DB: localcart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localcart -d localcart"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localcart_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override host to use Docker service name instead of localhost
      DATABASE_URL: "postgresql://localcart:localcart_secret@db:5432/localcart"
      DB_HOST: "db"
      # Set to 'true' only after adding SSL/HTTPS (nginx + certbot)
      HTTPS_ENABLED: "false"
      NEXT_PUBLIC_BASE_URL: "http://YOUR_VPS_IP:3010"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
